<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Bridge Load Diagnostic</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    font-size: 16px;
  }
  #status {
    padding: 8px 12px;
    border: 1px solid #999;
    display: inline-block;
    background: #f5f5f5;
  }
</style>
</head>
<body>
<div id="status">BRIDGE STARTING</div>

<script>
"use strict";

const MESSAGE_TYPE = "WAKUWAKU_AUDIO_BRIDGE_LOADED";
const SETTING_TYPE = "WAKUWAKU_AUDIO_SETTING";

const status = document.getElementById("status");

function sendLoaded() {
  status.textContent = "BRIDGE LOADED";
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: MESSAGE_TYPE
    }, "*");
  }
}

// 親ページから設定メッセージが来た場合も、
// 「このブリッジが動作している」ことだけを返す。
window.addEventListener("message", function(event) {
  const data = event.data;
  if (!data || data.type !== SETTING_TYPE) return;

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: MESSAGE_TYPE,
      settingReceived: true,
      enabled: data.enabled
    }, "*");
  }
});

window.addEventListener("load", sendLoaded);

// loadイベントを取りこぼしても確認できるよう、
// スクリプト実行時にも一度送信する。
sendLoaded();
</script>
</body>
</html>
