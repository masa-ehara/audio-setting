<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Setting Bridge Diagnostic</title>
</head>
<body>
<script>
(function () {
  const MESSAGE_TYPE = "WAKUWAKU_AUDIO_SETTING";
  const PING_TYPE = "WAKUWAKU_AUDIO_BRIDGE_PING";
  const PONG_TYPE = "WAKUWAKU_AUDIO_BRIDGE_PONG";

  window.addEventListener("message", function (event) {
    const data = event.data;
    if (!data || typeof data !== "object") return;

    // 通信確認用。保存処理は一切行わない。
    if (data.type === PING_TYPE) {
      if (event.source) {
        event.source.postMessage({
          type: PONG_TYPE,
          received: true
        }, "*");
      }
      return;
    }

    // 受け取ったON/OFF値を、そのまま読み出し値として返す。
    // localStorage / BroadcastChannel は使用しない。
    if (data.type === MESSAGE_TYPE && typeof data.enabled === "boolean") {
      if (event.source) {
        event.source.postMessage({
          type: MESSAGE_TYPE,
          enabled: data.enabled,
          verifyResult: true,
          verified: true,
          verifyReason: "POSTMESSAGE_OK"
        }, "*");
      }
    }
  });
})();
</script>
</body>
</html>
